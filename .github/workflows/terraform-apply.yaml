name: Terraform apply (OIDC)

on:
  push:
    branches:
      - main  # or any other branch you want to trigger the deployment
    paths: 
      - '**/*.tf'
      - '**/*.yaml'
  # Manual trigger, for when a push to main produces no apply run. A squash commit
  # whose message carries a CI-skip directive creates no run at all, so there is
  # nothing to re-run from the Actions tab and main silently stays unapplied.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    env:
      TF_VAR_pgpassword: ${{ secrets.TF_VAR_PGPASSWORD }}
      TF_VAR_pghost: ${{ secrets.TF_VAR_PGHOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::035866691871:role/incubator-tf-apply
        role-session-name: ghaincubatorsession
        aws-region: us-west-2

    - name: Terraform Apply
      uses: dflook/terraform-apply@v1
      with:
        path: terraform
        auto_approve: true
        backend_config_file: terraform/prod.backend.tfvars
